name: npm ci (Linux)

on:
  push:
  pull_request:

jobs:
  npm-ci:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts reads env('DATABASE_URL') at load time; generate only
      # needs a resolvable value, not a live database.
      DATABASE_URL: file:./prisma/dev.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: npm version
        run: npm --version
      - name: Clean install from lockfile
        run: npm ci
      - name: Generate Prisma Client (Prisma 7 does not do it automatically)
        run: npm run db:generate
      - name: Lint
        run: npm run lint
      - name: Generate Next.js route types (needed by tsc on a clean checkout)
        run: npx --no-install next typegen
      - name: Type check
        run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts needs a resolvable URL at load time; the Playwright
      # webServer overrides DATABASE_URL with the dedicated e2e.db.
      DATABASE_URL: file:./prisma/dev.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: npm version
        run: npm --version
      - name: Clean install from lockfile
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (production build, dedicated e2e.db)
        run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
