name: deploy

# Vercel Git deployments are disabled in vercel.json, so production is deployed
# only here, after the `ci` workflow finishes for a push to main. `needs` cannot
# reference jobs in another workflow, so the gate is this trigger plus the
# verify-ci job below.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # Owner-present rehearsal only. A drill skips the real deploy and migration,
  # smokes the given base_url and rolls back only the given previous URL. Both
  # the smoke and rollback jobs use the production environment, so the
  # controller's required reviewers gate every drill.
  workflow_dispatch:
    inputs:
      base_url:
        description: Production origin to smoke during the drill
        required: true
        type: string
      previous_deployment_id:
        description: Deployment id passed to the Vercel alias API during the drill
        required: true
        type: string
      previous_deployment_url:
        description: Deployment URL kept for display during the drill
        required: true
        type: string
      simulate_failure:
        description: Force the drill smoke check to fail
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# One production deploy at a time. A run that arrives while another deploy is
# in flight waits instead of cancelling work that may already be promoting.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify-ci:
    name: verify-ci
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Compare the CI commit with the current tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_sha" != "$HEAD_SHA" ]; then
            echo "::error::CI finished for $HEAD_SHA but main is now $main_sha; a newer commit is still being checked, so this run must not deploy."
            exit 1
          fi
          echo "Deploying $HEAD_SHA, the current tip of main."

  check-migrations:
    name: check-migrations
    needs: verify-ci
    runs-on: ubuntu-latest
    environment: production
    # The pulled Vercel file redacts runtime variables, so Prisma needs the
    # real direct connection from the production environment for status too.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    outputs:
      pending: ${{ steps.check.outputs.pending }}
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Clean install from lockfile
        run: npm ci
      - name: Detect pending migrations (npm run db:migrate:status:production)
        id: check
        run: |
          pending="$(node scripts/detect-pending-migrations.mjs)"
          echo "pending=$pending" >>"$GITHUB_OUTPUT"
          echo "Pending migrations: $pending"

  approval:
    name: approval
    needs: check-migrations
    if: needs.check-migrations.outputs.pending == 'true'
    runs-on: ubuntu-latest
    # Required reviewers are configured on this environment by the controller.
    environment: migration-approval
    steps:
      - name: Record the approval gate
        run: echo "Migration approved in environment migration-approval."

  migrate:
    name: migrate
    needs: [check-migrations, approval]
    if: github.event_name != 'workflow_dispatch' && always() && (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Clean install from lockfile
        run: npm ci
      - name: Refuse to migrate when the status check failed
        env:
          CHECK_RESULT: ${{ needs.check-migrations.result }}
        run: |
          if [ "$CHECK_RESULT" != "success" ]; then
            echo "::error::check-migrations finished with $CHECK_RESULT; refusing to migrate."
            exit 1
          fi
      - name: Print the commit and the snapshot reminder
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Migrating database for commit $COMMIT_SHA"
          echo "Reminder: confirm a snapshot or point-in-time checkpoint exists before applying migrations."
      - name: Apply pending migrations
        run: npm run db:migrate:production

  deploy:
    name: deploy
    needs: [verify-ci, migrate]
    # `always()` keeps a skipped approval from propagating a skip here. The two
    # real needs must still succeed, and a dispatch drill still skips deploy.
    if: always() && needs.verify-ci.result == 'success' && needs.migrate.result == 'success' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    # Application runtime variables stay in the Vercel project and are pulled
    # below; the direct database URL is injected here because the pulled file
    # redacts it, and the three Vercel credentials are Environment secrets.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      previous_url: ${{ steps.previous.outputs.previous_url }}
      previous_id: ${{ steps.previous.outputs.previous_id }}
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Clean install from lockfile
        run: npm ci
      - name: Pull the production environment from Vercel
        run: npx --yes vercel@66.6.0 pull --environment=production --token="$VERCEL_TOKEN"
      - name: Build with the pulled production settings
        run: npx --yes vercel@66.6.0 build --prod --token="$VERCEL_TOKEN"
      - name: Capture the current production deployment before promotion
        id: previous
        run: |
          # The alias points at the newest READY production deployment. Read it
          # before promoting so rollback has an explicit, verified target. The
          # uid is the id required by the alias REST endpoint in the rollback job.
          previous="$(npx --yes vercel@66.6.0 ls --prod --json --token="$VERCEL_TOKEN" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              const rows = Array.isArray(data) ? data : data.deployments;
              const current = rows.find(
                (row) => row.url && row.state === "READY" && row.target === "production",
              );
              if (!current) {
                console.error("No READY production deployment found before promotion.");
                process.exit(1);
              }
              if (!current.uid) {
                console.error("The current production deployment has no uid.");
                process.exit(1);
              }
              console.log(current.url);
              console.log(current.uid);
            });
          ')"
          previous_url="$(echo "$previous" | head -n 1)"
          previous_id="$(echo "$previous" | tail -n 1)"
          echo "previous_url=$previous_url" >>"$GITHUB_OUTPUT"
          echo "previous_id=$previous_id" >>"$GITHUB_OUTPUT"
          echo "Previous production deployment: $previous_url ($previous_id)"
      - name: Deploy the prebuilt output to production
        id: deploy
        run: |
          url="$(npx --yes vercel@66.6.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "deployment_url=$url" >>"$GITHUB_OUTPUT"
          echo "Deployed $url"

  smoke:
    name: smoke
    needs: deploy
    if: always() && (needs.deploy.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    # SITE_URL is an Environment variable, not a secret. Canonical assertions
    # compare against it, so smoke must never target a per-deployment URL. A
    # dispatch drill overrides BASE_URL in its own smoke step.
    env:
      BASE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Clean install from lockfile
        run: npm ci
      - name: Install Chromium for the smoke suite
        run: npx playwright install --with-deps chromium
      - name: Run smoke in a dispatch drill
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_URL: ${{ inputs.base_url }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "::error::Drill requested a failing smoke result."
            exit 1
          fi
          npm run test:smoke:production
      - name: Run the production smoke suite
        if: github.event_name != 'workflow_dispatch'
        run: npm run test:smoke:production
      - name: Upload the smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: |
            playwright-report/
            test-results/

  rollback:
    name: rollback
    needs: [deploy, smoke]
    if: failure()
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Select the previous production deployment
        env:
          DEPLOYED_PREVIOUS_ID: ${{ needs.deploy.outputs.previous_id }}
          DEPLOYED_PREVIOUS_URL: ${{ needs.deploy.outputs.previous_url }}
          DRILL_PREVIOUS_ID: ${{ inputs.previous_deployment_id }}
          DRILL_PREVIOUS_URL: ${{ inputs.previous_deployment_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PREVIOUS_ID="$DRILL_PREVIOUS_ID"
            PREVIOUS_URL="$DRILL_PREVIOUS_URL"
          else
            PREVIOUS_ID="$DEPLOYED_PREVIOUS_ID"
            PREVIOUS_URL="$DEPLOYED_PREVIOUS_URL"
          fi
          if [ -z "$PREVIOUS_ID" ]; then
            echo "::error::No previous production deployment id is available for rollback."
            exit 1
          fi
          echo "PREVIOUS_ID=$PREVIOUS_ID" >>"$GITHUB_ENV"
          echo "PREVIOUS_URL=$PREVIOUS_URL" >>"$GITHUB_ENV"
          echo "Rollback target: $PREVIOUS_URL ($PREVIOUS_ID)"
      - name: Roll back to the previous production deployment
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          # A team-only token cannot resolve a user for the Vercel CLI rollback,
          # inspect and promote commands, but it can call the project-scoped
          # alias REST endpoint. Move the production alias to the earlier id.
          alias_host="${SITE_URL#https://}"
          alias_host="${alias_host%%/*}"
          if [ -z "$alias_host" ]; then
            echo "::error::SITE_URL is empty; cannot resolve the production alias."
            exit 1
          fi
          status="$(curl -sS -o rollback-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"alias\":\"$alias_host\"}" \
            "https://api.vercel.com/v2/deployments/$PREVIOUS_ID/aliases?teamId=$VERCEL_ORG_ID")"
          cat rollback-response.json
          case "$status" in
            2??) ;;
            *)
              echo "::error::Vercel alias rollback failed with HTTP $status."
              exit 1
              ;;
          esac
          echo "Production alias $alias_host now points to $PREVIOUS_ID."

  finalize:
    name: finalize
    needs: [smoke, rollback]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record the smoke and rollback results
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
        run: echo "smoke=$SMOKE_RESULT rollback=$ROLLBACK_RESULT"
      - name: Fail when smoke did not pass
        if: needs.smoke.result != 'success'
        run: |
          echo "::error::Smoke finished with ${{ needs.smoke.result }}; production must stay red after rollback."
          exit 1
      - name: Confirm the smoke check passed
        if: needs.smoke.result == 'success'
        run: echo "Smoke passed; the production deploy is complete."
